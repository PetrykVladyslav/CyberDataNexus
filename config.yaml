# ============================================================
#  config.yaml — єдине джерело правди для класифікатора файлів
#  Всі категорії, підкатегорії, розширення, теги і параметри
#  навчання зберігаються тут. Модулі не містять хардкоду.
# ============================================================

# ── Параметри датасету ───────────────────────────────────────
dataset:
  total_samples: 100_000
  train_ratio: 0.9
  typo_probability: 0.2         # ймовірність опечатки в токені
  confusion_probability: 0.2    # ймовірність "confusion" імені
  extra_token_probability: 0.4  # додати другий токен з домену
  generic_token_probability: 0.5
  year_probability: 0.3
  no_extension_probability: 0.1
  noise_remove_tag_probability: 0.1
  noise_add_wrong_tag_probability: 0.05
  generic_tag_probability: 0.4
  category_tag_skip_probability: 0.1  # НЕ додавати категорію як тег

# ── Параметри моделі ─────────────────────────────────────────
model:
  encoder_name: "all-MiniLM-L6-v2"
  batch_size: 128
  tag_threshold: 0.4            # поріг впевненості для тегів

  category_grid:
    C: [0.1, 1.0, 3.0]
    solver: ["lbfgs"]
    max_iter: 3000

  tag_grid:
    estimator__C: [0.3, 1.0, 3.0]
    max_iter: 3000

# ── Категорії та їх розширення файлів ───────────────────────
#  category_name → список розширень
#  Використовується AI для навчання (generate_dataset / semantic_model).
extension_map:
  audio:      ["mp3", "wav", "flac", "aac", "ogg", "m4a"]
  video:      ["mp4", "mov", "mkv", "avi", "webm", "wmv", "pptx", "ppt"]
  image:      ["jpg", "jpeg", "png", "gif", "bmp", "webp", "svg", "tiff"]
  document:   ["pdf", "docx", "doc", "txt", "odt", "rtf", "md"]
  spreadsheet: ["xlsx", "xls", "ods"]
  data:       ["csv", "json", "xml", "yaml", "parquet", "jsonl"]
  archive:    ["zip", "tar", "gz", "rar", "7z", "bz2"]
  code:       ["py", "js", "ts", "java", "go", "rs", "cpp", "c", "rb", "php", "swift", "kt"]
  database:   ["sql", "db", "sqlite", "mdb"]

# ── Маппінг розширення → базова категорія (для FileRecord) ───
#  Найвищий пріоритет при класифікації в app.py.
#  Потрібен для розширень, чия AI-категорія відрізняється від базової
#  (spreadsheet, data, database не є базовими категоріями → document).
#  Якщо розширення тут є — воно ЗАВЖДИ перекриває AI-результат.
