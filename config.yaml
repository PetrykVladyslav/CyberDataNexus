# ── Flask-додаток ────────────────────────────────────────────
app:
  upload_folder: "uploads"
  data_file: "cyberpunk_data.json"
  max_upload_mb: 500          # максимальний розмір файлу в мегабайтах
  host: "0.0.0.0"
  port: 5000
  debug: true

# ── Базові (системні) категорії ──────────────────────────────
#  id       — використовується в коді та API
#  label    — відображається у фронтенді
#  emoji    — іконка категорії
#  builtin  — true = не можна видалити через API
base_categories:
  - id: document
    label: "DOCUMENTS"
    emoji: "📄"
    builtin: true
  - id: code
    label: "CODE"
    emoji: "💻"
    builtin: true
  - id: image
    label: "IMAGES"
    emoji: "🖼️"
    builtin: true
